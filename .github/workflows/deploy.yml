name: Deploy wiki

# 위키는 DDD-Community/DDD_14_TTADAK 의 wiki/ 로 옮겼다.
# 이 저장소는 옛 주소로 들어온 사람을 새 주소로 넘기는 페이지만 배포한다.
# 새 위키의 댓글(Giscus)이 아직 이 저장소의 Discussions를 쓰므로 저장소를 보관(archive)하지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
